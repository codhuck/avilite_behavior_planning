[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avlite-signal-perception"
version = "0.1.0"
description = "Camera traffic-light perception and model selection for AVLite"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "opencv-python-headless==4.11.0.86"]

[tool.setuptools]
packages = ["avlite_signal_perception"]

[tool.setuptools.package-data]
avlite_signal_perception = ["models/*.npz", "models/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
