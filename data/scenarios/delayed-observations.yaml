version: 1
name: delayed-observations
map: urban.xodr
route: urban-route.json
strategy: road-rules
seed: 0
duration: 65
dt: 0.05
cruise_speed: 3
parameters:
  pedestrian_start:
    uniform: [14, 16]
  pedestrian_speed:
    uniform: [0.8, 1.2]
actors:
  - id: pedestrian
    kind: pedestrian
    x: 48
    y: -6
    heading: 1.5707963267948966
    speed: $pedestrian_speed
    start_time: $pedestrian_start
    length: 0.6
    width: 0.6
  - id: parked-van
    kind: vehicle
    x: 42
    y: -5.5
    length: 5
    width: 2
signals:
  - id: light
    initial: Red
    changes:
      - {time: 12, state: Green}
criteria:
  max_stopped_seconds: 25
faults:
  - {start: 16, duration: 3, kind: delay, latency: 0.6}
  - {start: 23, duration: 1, kind: dropout}
